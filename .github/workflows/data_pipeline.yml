name: Weekly Epidemiological Data Refresh

on:
  schedule:
    # Run every Monday at 06:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Pipeline (InfoDengue & Open-Meteo API)
        run: |
          python main.py

      - name: Commit & Push Updated Dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono(data): automated weekly refresh of dengue and climate surveillance dataset"
          file_pattern: "dengue_processed_data.csv"
